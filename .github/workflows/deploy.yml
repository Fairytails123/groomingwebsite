name: Deploy to GitHub Pages

# GitHub Pages IS production for this site (unlike the Main Website, which
# deploys to Hostinger and keeps Pages as a manual preview). Every push to
# main deploys.
#
# Indexability: the INDEXABLE repo Actions variable is `true` (set at go-live
# 2026-08-08) and MUST stay that way — this workflow deploys the live, indexed
# customer site. Unsetting or renaming it ships noindex + robots Disallow across
# production on the very next push, silently, via a green run.
# Check before you touch it: gh variable list -R Fairytails123/groomingwebsite
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_INDEXABLE: ${{ vars.INDEXABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build with Astro
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
